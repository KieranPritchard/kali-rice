# If you get glitches or lag in UTM, change backend to "xrender"
backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# Blur is heavy in a VM. Uncomment once everything else runs smoothly.
# blur-method = "dual_kawase";
# blur-strength = 3;
